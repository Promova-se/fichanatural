# Publica o site na Napoleon (cPanel) a cada envio para a branch main.
# Precisa dos Secrets do repositório: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Publicar na Napoleon

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-napoleon
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se o FTP está configurado
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Secrets de FTP ainda não cadastrados; publicação pulada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Gerar o site
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Enviar por FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
